; ================================================================
; PlatformIO — AWS IoT Certificate Uploader
;
; Recovery / bring-up tool. The main firmware provisions the modem's
; certificate store by itself on every connect attempt, so this sketch
; is NOT part of the normal flashing workflow — reach for it only to
; inspect or repair a modem's cert store out of band.
;
; It shares energy_meter_2_firmware's include/ and runs that project's
; gen_certs.py against the same PEM files under ../certs/<device>/, so
; the filenames and bytes it writes are by construction identical to
; the ones the firmware expects. Do not add a local config.h or
; certs.h here — that divergence is exactly what broke bring-up.
; ================================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

extra_scripts = pre:../energy_meter_2_firmware/scripts/gen_certs.py
custom_cert_device = energy-meter-002

build_flags =
    -I ../energy_meter_2_firmware/include
