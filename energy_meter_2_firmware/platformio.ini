; ================================================================
; PlatformIO - energy-meter-6 (firmware 2.x: remote update + diagnostics)
;
; One branch per meter (Firmware-NN). This branch builds ONLY energy-meter-6,
; so a plain upload cannot give the board another meter's identity:
;
;   pio run -t upload                       -> energy-meter-6 (default)
;   pio run -e nettest -t upload            -> energy-meter-6, recovery ladder in minutes
;   pio run -e flashtest -t upload          -> energy-meter-6 + SPI-NOR self-test
;   python tools/run_host_tests.py          -> host unit tests (no board)
;
; Installed meters (002, 3, 4, 5, 6 ... 25) stay on firmware 1.0.0 and keep
; their own branches; never flash a 2.x image built here onto them.
;
; All meters use the same certificate (certs/energy-meter-002/), attached
; to every AWS thing. Two boards with one client ID knock each other off
; the broker in a loop.
; ================================================================
[platformio]
default_envs = energy-meter-6

[env]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    plerup/EspSoftwareSerial @ ^8.1.0
    bblanchon/ArduinoJson @ ^7.0.0

; Regenerates include/certs_generated.h from ../certs/<custom_cert_device>/
; before every build, and fails the build if the private key does not belong
; to the certificate. cert_uploader runs this same script against the same
; PEM files, so the two projects cannot drift apart.
extra_scripts = pre:scripts/gen_certs.py
custom_cert_device = energy-meter-002

; Default partition table (2 x 1.25 MB app slots + otadata) = OTA-ready.
build_flags =
    -D TINY_GSM_MODEM_SIM7600
    -D CORE_DEBUG_LEVEL=0
    -D HAS_POWER_SENSE=0

[env:energy-meter-6]
build_flags =
    ${env.build_flags}
    -D AWS_THING_NAME=\"energy-meter-6\"

; Bench build: network recovery ladder at 1 / 2 / 3 min instead of 10 / 20 / 30.
; Same identity, so never run it next to the real energy-meter-6.
[env:nettest]
build_flags =
    ${env.build_flags}
    -D AWS_THING_NAME=\"energy-meter-6\"
    -D NET_LADDER_FAST

; Bring-up build: runs the destructive storage_selftest() at boot and prints
; queue status every 5 s. Connects as energy-meter-6, so don't run it on a
; board while another board is online as energy-meter-6.
;   pio run -e flashtest -t upload && pio device monitor
[env:flashtest]
build_flags =
    ${env.build_flags}
    -D AWS_THING_NAME=\"energy-meter-6\"
    -D FLASH_SELFTEST

; Host-side unit tests (reset-reason mapping, recovery ladder, rate limiter,
; outage estimate) need no board and no PlatformIO env:
;   python tools/run_host_tests.py   (uses g++/clang++, or: pip install ziglang)
