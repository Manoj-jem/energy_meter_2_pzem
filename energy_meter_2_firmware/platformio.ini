; ================================================================
; PlatformIO
; ================================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    plerup/EspSoftwareSerial @ ^8.1.0

; Regenerates include/certs_generated.h from ../certs/<custom_cert_device>/
; before every build, and fails the build if the private key does not belong
; to the certificate. cert_uploader runs this same script against the same
; PEM files, so the two projects cannot drift apart.
extra_scripts = pre:scripts/gen_certs.py
custom_cert_device = energy-meter-002

build_flags =
    -D TINY_GSM_MODEM_SIM7600
