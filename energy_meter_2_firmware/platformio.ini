; ================================================================
; PlatformIO
;
; One environment per meter. They build the same firmware and differ only
; in AWS_THING_NAME (= MQTT client ID = topic prefix = backend device_id).
;
;   pio run -t upload                       -> energy-meter-002 (default)
;   pio run -e energy-meter-3 -t upload     -> energy-meter-3
;
; Both meters use the same certificate (certs/energy-meter-002/), attached
; to both AWS things. Flashing the wrong environment makes the two meters
; share a client ID, and AWS then disconnects them alternately forever.
; ================================================================
[platformio]
default_envs = energy-meter-002

[env]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    plerup/EspSoftwareSerial @ ^8.1.0

; Regenerates include/certs_generated.h from ../certs/<custom_cert_device>/
; before every build, and fails the build if the private key does not belong
; to the certificate. cert_uploader runs this same script against the same
; PEM files, so the two projects cannot drift apart.
extra_scripts = pre:scripts/gen_certs.py
custom_cert_device = energy-meter-002

build_flags =
    -D TINY_GSM_MODEM_SIM7600

; Identity comes from the default in include/config.h.
[env:energy-meter-002]

[env:energy-meter-3]
build_flags =
    ${env.build_flags}
    -D AWS_THING_NAME=\"energy-meter-3\"
